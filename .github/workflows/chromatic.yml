# Visual regression via Chromatic: snapshots every story — the template
# stories additionally in a mode matrix (light/dark × desktop/mobile, see
# src/templates/chromatic-modes.ts), so layout regressions are caught at the
# composition level, not only per component. Changed snapshots fail the check
# until the design-system owner accepts them in the Chromatic UI — that is the
# visual half of the review gate (docs/DESIGN_SYSTEM.md §6).
#
# Setup (one-time): create the project on chromatic.com for this repo and add
# its token as the repository secret CHROMATIC_PROJECT_TOKEN. Until the secret
# exists, the job skips instead of failing.
name: Chromatic

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Check for project token
        id: token
        run: echo "present=${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0 # Chromatic needs history for baselines/TurboSnap
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.token.outputs.present == 'true'
      - uses: chromaui/action@v13
        if: steps.token.outputs.present == 'true'
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: main # baselines auto-advance on main; PRs need acceptance
          onlyChanged: true # TurboSnap: snapshot only stories affected by the diff
